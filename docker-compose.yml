services:
  db:
    # Postgres 17 with the pgvector extension already installed.
    image: pgvector/pgvector:pg17
    environment:
      # Values come from .env (compose reads it automatically for ${...}).
      # ":?" aborts with a clear message if the variable is missing.
      # Read by Postgres only on first init of an empty volume.
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      # host:container. 5433 avoids clashing with another Postgres on 5432.
      - "5433:5432"
    volumes:
      # Named volume: data survives container recreation.
      - pgdata:/var/lib/postgresql/data
      # *.sql here run once, on first init of an empty volume. Read-only mount.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # $$ keeps the variable for the shell INSIDE the container (compose does not expand it).
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    # --reload restarts the server when a file changes (dev only).
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      # Variables (DATABASE_URL) come from .env, which is not committed.
      - .env
    ports:
      # Host 8001 -> container 8000 (8000 is often taken by other local projects).
      - "8001:8000"
    volumes:
      # Bind mount: edit code on the Mac, container sees it instantly.
      - ./:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
